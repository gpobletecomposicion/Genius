<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genius</title>
<meta name="theme-color" content="#EEF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Genius">
<meta name="application-name" content="Genius">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Albert Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/albert-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Albert Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/albert-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Albert Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/albert-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Albert Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/albert-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Albert Sans";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/albert-sans-latin-800-normal.woff2) format("woff2")}
:root{
  --paper:#EEF1F0; --surface:#FFFFFF; --ink:#16232C; --muted:#5A6A73; --line:#D2D9DC;
  --accent:#2F5F7E; --accent-soft:#DCE7EE; --moss:#A8922A; --moss-soft:#F1EBCF;
  --warn:#9A3B1F; --warn-soft:#F6E2DA; --ok:#2E6B4A; --ok-soft:#DDEDE3;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10181D; --surface:#18232A; --ink:#E6ECEE; --muted:#97A6AE; --line:#2B3A43;
    --accent:#86B4D2; --accent-soft:#1F3341; --moss:#D8C25E; --moss-soft:#33301C;
    --warn:#E79A7E; --warn-soft:#3A2219; --ok:#8CC9A5; --ok-soft:#1C3328;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10181D; --surface:#18232A; --ink:#E6ECEE; --muted:#97A6AE; --line:#2B3A43;
  --accent:#86B4D2; --accent-soft:#1F3341; --moss:#D8C25E; --moss-soft:#33301C;
  --warn:#E79A7E; --warn-soft:#3A2219; --ok:#8CC9A5; --ok-soft:#1C3328;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Albert Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));
  padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.01em;margin:0 10px 2px}
.brand-sub{color:var(--muted);font-size:.85rem;margin:0 10px 22px}
nav.rail a{display:block;padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
nav.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav.rail .spacer{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);cursor:pointer;font-weight:600;font-size:.95rem}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.toggle[aria-checked="true"] .switch{background:var(--accent)}
.toggle[aria-checked="true"] .switch::after{transform:translateX(18px)}
.stamp{color:var(--muted);font-size:.78rem;margin:10px 10px 0}

main{padding:32px clamp(18px,4vw,48px) 80px;max-width:1180px;width:100%}
h1{font-size:clamp(2rem,4vw,2.9rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
h2{font-size:1.3rem;margin:34px 0 12px;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:0 0 8px}
.lede{color:var(--muted);max-width:62ch;margin:0 0 24px}
p{max-width:70ch}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:10px 16px;border-radius:9px;cursor:pointer;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.grid-calc{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}

/* hero del modelo */
.model-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.price{font-size:1.6rem;font-weight:800}
.price small{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink)}
.spec{padding:16px 14px 18px 0;border-bottom:1px solid var(--line)}
.spec .v{font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:800;letter-spacing:-.02em;line-height:1}
.spec .v span{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.spec .k{color:var(--muted);font-size:.9rem;margin-top:6px}

.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}
.list li:last-child{border-bottom:0}
.list li b{font-weight:600;text-align:right}

.note{border-left:4px solid var(--moss);background:var(--moss-soft);padding:14px 16px;border-radius:0 12px 12px 0;margin:12px 0}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note p{margin:4px 0}
.internal-tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--moss);margin-bottom:4px}
body.client .internal{display:none!important}
.client-only{display:none}
body.client .client-only{display:inline}
.tbc{color:var(--moss);font-weight:600}

/* tabla comparativa */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{position:sticky;top:0;background:var(--surface);font-size:1rem}
tbody th{font-weight:500;color:var(--muted);width:30%}
tr.diff td{background:var(--accent-soft)}
tr.group th{color:var(--ink);font-weight:800;padding-top:22px;background:transparent}

/* campos */
.field{margin-bottom:18px}
.field label,.field .lab{display:flex;justify-content:space-between;gap:12px;font-weight:600;margin-bottom:8px}
.field label output{color:var(--accent);font-weight:800}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 12px}
.money span{color:var(--muted)}
.money input{border:0;background:transparent;padding:12px 6px;width:100%;min-width:0}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* resultados */
.result{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.big{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.big-label{color:var(--muted);margin-top:6px}
.bars{margin:22px 0 6px;display:grid;gap:12px}
.bar .row{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:4px}
.bar .track{height:14px;background:var(--paper);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--accent);transition:width .35s ease}
.bar.alt .fill{background:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin-top:16px;font-size:.95rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700;text-align:right}
.est{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-bottom:12px}

/* gama */
.range-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.car{display:block;text-decoration:none;color:inherit;padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:150px;position:relative}
.car .name{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.car .what{color:var(--muted);font-size:.92rem}
.car .from{margin-top:18px;font-weight:700}
.car.soon{background:transparent;border-style:dashed;cursor:default}
.car.soon .name{color:var(--muted)}
.car.live{border:2px solid var(--ink)}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--muted);margin-top:14px}

svg.chart text{fill:var(--muted);font-size:12px;font-family:inherit}
.legend{display:flex;gap:18px;font-size:.88rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.mobile-nav{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.rail{display:none}
  main{padding-top:20px;padding-bottom:110px}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .mobile-nav a{flex:none;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem}
  .mobile-nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .mobile-top{display:flex!important}
  .grid2,.grid-calc{grid-template-columns:1fr}
  .result{position:static}
  .specs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.mobile-top{display:none;justify-content:space-between;align-items:center;margin-bottom:16px}
.mobile-top .toggle{padding:8px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* sensación de app */
html,body{overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
nav,button,.seg,.toggle,.car,.mobile-nav{-webkit-user-select:none;user-select:none}
button:active,.car:active,.seg button:active{transform:scale(.98)}
.install{display:none;margin-bottom:10px;border:0;border-radius:12px;padding:12px;background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer}
.install.show{display:block}
.offline-chip{display:none;margin:8px 10px 0;font-size:.8rem;font-weight:700;color:var(--moss)}
body.is-offline .offline-chip{display:block}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--paper);transition:opacity .35s ease}
.splash img{width:96px;height:96px;border-radius:22px}
.splash.hide{opacity:0;pointer-events:none}
@media (max-width:900px){ .mobile-nav a{min-height:44px;display:flex;align-items:center} }

/* anexo: ecosistema Volvo–Geely */
.eco-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.eco-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.eco-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;min-height:44px;font-weight:700;cursor:pointer}
.eco-chip.other{background:transparent;border-style:dashed;color:var(--muted);font-weight:600}
.eco-chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);border-style:solid}
.eco-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);margin:0 0 12px}
.eco-legend span{display:inline-flex;align-items:center;gap:6px}
.eco-legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--accent)}
.eco-legend i.d{border-top-style:dashed;border-color:var(--warn)}
.eco-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 2px 10px}
.eco-map{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0 30px;min-width:calc(var(--n) * 128px)}
.eco-col{display:flex;flex-direction:column;min-width:0}
.eco-col h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:8px 0 2px;font-weight:800}
.eco-col h4:first-child{margin-top:0}
.eco-stack{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px}
.eco-node{position:relative;z-index:1;display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:9px 10px;cursor:pointer;min-height:44px;transition:opacity .2s}
.eco-node b{display:block;font-size:.88rem;line-height:1.2;font-weight:700}
.eco-node small{display:block;color:var(--muted);font-size:.74rem;line-height:1.25;margin-top:3px}
.eco-node.mod{border:2px solid var(--ink)}
.eco-node.mod b{font-size:1.02rem;font-weight:800}
.eco-node.out{border-style:dashed}
.eco-node.pv{border-style:dashed;border-color:var(--warn)}
.eco-node.dim{opacity:.35}
.eco-node.sel{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.eco-node.sel small,.eco-node.sel .eco-st{color:inherit;opacity:.9}
.eco-st{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.02em;margin-top:5px;color:var(--muted)}
.eco-st.pv{color:var(--warn)}
.eco-st.duda{color:var(--moss)}
svg.eco-lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
svg.eco-lines path{fill:none;stroke:var(--accent);stroke-width:2;opacity:.55}
svg.eco-lines path.hot{stroke-width:3;opacity:.95}
svg.eco-lines path.d{stroke:var(--warn);stroke-dasharray:6 5;opacity:.8}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--muted)}
.pill.of{background:var(--ok-soft);color:var(--ok)}
.pill.pr{background:var(--accent-soft);color:var(--accent)}
.pill.pv{background:var(--warn-soft);color:var(--warn)}
.eco-detail{margin-bottom:18px;scroll-margin-top:16px}
.eco-detail h2{margin:4px 0 6px;font-size:1.5rem}
.eco-duda{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0 0;font-size:.95rem}
.eco-group{margin:0 0 14px}
.eco-group h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:800}
.eco-links{display:flex;flex-wrap:wrap;gap:6px}
.eco-link{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 11px;min-height:40px;cursor:pointer;font-size:.9rem;font-weight:600;text-align:left}
.eco-link.pv{border-style:dashed;border-color:var(--warn)}
.eco-link small{color:var(--muted);font-weight:500}
.eco-path{padding:10px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.eco-path:last-child{border-bottom:0}
.eco-path .arrow{color:var(--muted);margin:0 4px}
.eco-path a{color:var(--accent);font-weight:700}
.eco-tree ul{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--line)}
.eco-tree>ul{padding-left:0;border-left:0}
.eco-tree li{margin:8px 0}
.eco-tree li>ul{margin-left:14px}
.own{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:9px 12px;min-height:44px;cursor:pointer;text-align:left;max-width:100%}
.own b{font-weight:700}
.own small{color:var(--muted)}
.own.ref{border-style:dashed;background:transparent}
.own.sel{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.own.sel small{color:inherit;opacity:.9}
.eco-link-ficha{display:inline-block;margin-top:12px;color:var(--accent);font-weight:700;text-decoration:none}
@media (max-width:640px){
  .eco-map{grid-template-columns:1fr;min-width:0;gap:26px 0}
  .eco-stack{flex-direction:row;flex-wrap:wrap}
  .eco-col h4{flex:1 0 100%}
  .eco-node{width:auto;flex:1 1 140px}
}
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true"><img src="icons/icon-192.png" alt=""></div>
<div class="app">
  <nav class="rail" aria-label="Secciones">
    <div class="brand">Genius</div>
    <div class="brand-sub">Volvo · La Dehesa</div>
    <div id="navlinks"></div>
    <div class="spacer"></div>
    <button class="install" id="installBtn">Instalar app</button>
    <div class="toggle" role="switch" tabindex="0" aria-checked="false" data-client-toggle>
      Modo cliente <span class="switch" aria-hidden="true"></span>
    </div>
    <p class="stamp" id="stamp"></p>
    <p class="offline-chip">Sin conexión: funcionando con los datos guardados</p>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="mobile-nav" id="mobilenav" aria-label="Secciones"></nav>

<script src="modelos.js"></script>
<script src="ecosistema.js"></script>
<script>
/* ---------- Datos: vienen de modelos.js ---------- */
const DATA_DATE = GENIUS_DATA.fecha;
const MODELS = GENIUS_DATA.modelos;
let M, V, ORDER, EQUIP;
const RANGE = GENIUS_DATA.gama;
const CAMP = GENIUS_DATA.campana;
const fromPrice = id => Math.min(...Object.values(GENIUS_DATA.modelos[id].versiones).map(v=>v.price));
const COND = {ciudad:{label:"Ciudad",f:0.86},mixto:{label:"Mixto",f:1},autopista:{label:"Autopista",f:1.2}};
/* Modelos a bencina (propulsion:"bencina") e híbridos enchufables (propulsion:"phev"): ficha, comparador y costo total;
   sin calculadoras eléctricas. Los enchufables tienen su propia calculadora (vista "phev"). */
const isEV = m => !m.propulsion;
const isPH = m => m.propulsion==="phev";
const EV_VIEWS = ["energia","carga","autonomia"];
const KML_COND = {ciudad:"kmLCity",mixto:"kmL",autopista:"kmLHwy"};

/* ---------- Estado (guardado en este navegador) ---------- */
const DEFAULTS = {
  model:"ex30", version:"plus", client:false,
  kmDay:40, daysWeek:6, cond:"mixto", cold:false, homeShare:80,
  tHome:250, tPublic:400, fuel:1550, kmL:12,
  years:5, kmYear:15000, priceIce:32000000, maintEv:200000, maintEvSrv:300000, maintIce:450000,
  permEv:120000, permIce:380000, insEv:1000000, insIce:1000000, resEv:50, resIce:50,
  maintMh:300000, permMh:380000, insMh:1000000, resMh:50,
  maintPh:300000, permPh:1000000, insPh:1500000, resPh:50,
  phCharge:6, phR_xc60:62, phR_xc90:55, phKmL_xc60:12.5, phKmL_xc90:12.5,
  from:20, to:80, charger:"wb7",
  limit:100, reserve:true
};
let S;
try{ S = Object.assign({},DEFAULTS, JSON.parse(localStorage.getItem("genius-state")||"{}")); }catch(e){ S = {...DEFAULTS}; }
function save(){ try{ localStorage.setItem("genius-state",JSON.stringify(S)); }catch(e){} }
/* Modelo activo: lo eligen la Gama, la ficha o el selector de las calculadoras. Cada modelo recuerda su versión. */
function setModel(id){
  if(!MODELS[id]) id="ex30";
  if(S.model && V && V[S.version]){ S.verByModel = Object.assign({},S.verByModel,{[S.model]:S.version}); }
  S.model=id; M=MODELS[id]; V=M.versiones; ORDER=M.orden; EQUIP=M.equipamiento;
  if(isEV(M)) S.lastEv=id;
  if(isPH(M)) S.lastPh=id;
  const keep=(S.verByModel||{})[id];
  S.version = V[keep] ? keep : (V[S.version] ? S.version : ORDER[0]);
}

const clp = n => "$" + Math.round(n).toLocaleString("es-CL");
const fmt = (n,d=0) => Number(n).toLocaleString("es-CL",{minimumFractionDigits:d,maximumFractionDigits:d});

const dcText = v => v.dc ? v.dc+" kW" : "Por confirmar";
/* Modo cliente: los datos "Por confirmar" se muestran como "Consultar con tu asesor" y las
   aclaraciones internas entre paréntesis (por confirmar, verificar, ficha Inchcape…) se ocultan. */
const INTERNAL_RX = /\s*\((?=[^()]*(?:confirmar|verificar|ficha|web|dato de otro mercado|dato Core))[^()]*\)/gi;
function pub(s,omit){
  s = String(s);
  if(/^por confirmar/i.test(s)) return `<span class="internal tbc">${s}</span>${omit?"":`<span class="client-only">Consultar con tu asesor</span>`}`;
  return s.replace(INTERNAL_RX, m=>`<span class="internal">${m}</span>`);
}
const consOf = (v) => v.cons * COND[S.cond].f * (S.cold ? 1.2 : 1); // kWh/100 km

function energyCalc(){
  const v = ver();
  const cons = consOf(v);
  const kmMonth = S.kmDay * S.daysWeek * 4.33;
  const kwhMonth = kmMonth * cons / 100;
  const tMix = (S.homeShare/100)*S.tHome + (1-S.homeShare/100)*S.tPublic;
  const evMonth = kwhMonth * tMix;
  const iceMonth = kmMonth / S.kmL * S.fuel;
  return {cons,kmMonth,kwhMonth,tMix,evMonth,iceMonth,evKm:evMonth/kmMonth||0,iceKm:iceMonth/kmMonth||0};
}

/* Campos del Volvo elegido en costo total: los eléctricos y los a bencina guardan valores separados. */
const tcoKeys = () => isEV(M) ? {maint:"maintEvSrv",perm:"permEv",ins:"insEv",res:"resEv"} : isPH(M) ? {maint:"maintPh",perm:"permPh",ins:"insPh",res:"resPh"} : {maint:"maintMh",perm:"permMh",ins:"insMh",res:"resMh"};
function tcoCalc(){
  const v = ver(), K = tcoKeys(), isE = isEV(M);
  const iceKm = S.fuel / S.kmL;
  const ph = isPH(M) ? phevCalc() : null;
  const kmL = isE || ph ? null : v[KML_COND[S.cond]];
  const evKm = isE ? energyCalc().evKm : ph ? ph.costKm : S.fuel / kmL;
  const yrs = S.years, km = S.kmYear;
  /* Todos los modelos: la mantención se ingresa por servicio y se cuenta por la pauta
     (cada mantKm o mantMeses, lo que ocurra primero). Eléctricos 30.000 km / 3 años; híbridos 10.000 km / 1 año. */
  const services = Math.max(Math.floor(yrs*12/M.mantMeses), Math.floor(km*yrs/M.mantKm));
  const maintTot = S[K.maint]*services;
  const ev = {buy:v.price*(1-S[K.res]/100), energy:evKm*km*yrs, maint:maintTot, perm:S[K.perm]*yrs, ins:S[K.ins]*yrs};
  const ice = {buy:S.priceIce*(1-S.resIce/100), energy:iceKm*km*yrs, maint:S.maintIce*yrs, perm:S.permIce*yrs, ins:S.insIce*yrs};
  const sum = o => Object.values(o).reduce((a,b)=>a+b,0);
  const cumEv=[], cumIce=[];
  for(let y=0;y<=yrs;y++){
    cumEv.push(v.price + y*(evKm*km + maintTot/yrs + S[K.perm] + S[K.ins]));
    cumIce.push(S.priceIce + y*(iceKm*km + S.maintIce + S.permIce + S.insIce));
  }
  let cross=null; for(let y=1;y<=yrs;y++){ if(cumEv[y]<=cumIce[y] && cumEv[y-1]>cumIce[y-1]){ const a=cumEv[y-1]-cumIce[y-1], b=cumEv[y]-cumIce[y]; cross=y-1+a/(a-b); break; } }
  if(cumEv[0]<=cumIce[0]) cross=0;
  return {ev,ice,tEv:sum(ev),tIce:sum(ice),cumEv,cumIce,cross,services,kmL,ph};
}

function chart(r){
  const W=460,H=190,p={l:8,r:8,t:12,b:24}, n=r.cumEv.length-1;
  const all=[...r.cumEv,...r.cumIce], mn=Math.min(...all)*0.95, mx=Math.max(...all)*1.02;
  const x=i=>p.l+(W-p.l-p.r)*i/n, y=v=>p.t+(H-p.t-p.b)*(1-(v-mn)/(mx-mn));
  const path=a=>a.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const ticks=r.cumEv.map((_,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${i}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gasto acumulado por año">
    <path d="${path(r.cumIce)}" fill="none" stroke="var(--muted)" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="${path(r.cumEv)}" fill="none" stroke="var(--accent)" stroke-width="3.5"/>${ticks}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>${M.nombre} acumulado</span><span><i style="background:var(--muted)"></i>${isEV(M)?"Bencina":"Otro auto"} acumulado</span><span>Eje: años</span></div>`;
}

function chargeCalc(){
  const v=ver(), c=CHARGERS[S.charger], a=Math.min(S.from,S.to), b=Math.max(S.from,S.to);
  let min;
  if(c.ac){ min = v.net*(b-a)/100 / (Math.min(c.kw,v.ac)*0.9) * 60; }
  else{
    const rate = v.dc1080/70; // min por punto %
    const seg=(lo,hi,f)=>Math.max(0,Math.min(b,hi)-Math.max(a,lo))*rate*f;
    min = seg(0,10,1.1)+seg(10,80,1)+seg(80,100,3);
  }
  const kwh=v.net*(b-a)/100, km=kwh/(v.cons/100);
  const cost=kwh*(c.ac?S.tHome:S.tPublic);
  return {min,kwh,km,cost,c};
}

/* ---------- Híbrido enchufable ----------
   Cada noche que carga, al día siguiente recorre en eléctrico hasta su autonomía real; el resto del día y los días sin carga
   andan en modo híbrido con batería descargada. Energía de la red = km eléctricos × (batería útil ÷ autonomía real),
   sin pérdidas de carga, igual que la calculadora de los eléctricos. Mes = 4,33 semanas. */
function phevCalc(){
  const v = ver(), id = S.model;
  const R = S["phR_"+id] || M.evRealDef, kmLH = S["phKmL_"+id] || M.kmLHyb;
  const days = S.daysWeek, charges = Math.min(S.phCharge, days);
  const kmWeek = S.kmDay*days, eWeek = charges*Math.min(S.kmDay, R);
  const pct = kmWeek ? eWeek/kmWeek*100 : 0;
  const kmMonth = kmWeek*4.33, eKm = eWeek*4.33, fKm = kmMonth - eKm;
  const kwhKm = v.net / R, kwh = eKm*kwhKm, liters = fKm/kmLH;
  const luz = kwh*S.tHome, benc = liters*S.fuel, total = luz+benc;
  const noCharge = kmMonth/kmLH*S.fuel;
  const evRef = MODELS[M.equivEv.modelo], evV = evRef.versiones[M.equivEv.version];
  const evMonth = kmMonth*evV.cons/100*S.tHome;
  const dayKwh = Math.min(S.kmDay,R)*kwhKm;
  return {R,kmLH,charges,pct,kmMonth,eKm,fKm,kwh,liters,luz,benc,total,noCharge,evRef,evV,evMonth,
    costKm: kmMonth ? total/kmMonth : 0, combKmL: liters>0 ? kmMonth/liters : null,
    dayKwh, dayH: dayKwh/(M.acKw*0.9)};
}

/* ---------- Anexo: ecosistema Volvo–Geely (datos en ecosistema.js) ---------- */
const ECO = ECO_DATA;
const EN = Object.fromEntries(ECO.nodos.map(n=>[n.id,n]));
const EOUT = {}, EIN = {};
ECO.nodos.forEach(n=>{ EOUT[n.id]=[]; EIN[n.id]=[]; });
ECO.enlaces.forEach(([a,b])=>{ EOUT[a].push(b); EIN[b].push(a); });
const ECOL = id => ECO.columnas.findIndex(c=>c.grupos.some(g=>g.tipos.includes(EN[id].t)));
const EGRUPOS = ECO.columnas.flatMap(c=>c.grupos);
const inChain = n => n.t!=="prop" || EOUT[n.id].length>0;      // empresas solo si aportan algo a un modelo
const ecoModOf = appId => (ECO.nodos.find(n=>n.app===appId)||{}).id;
const ST_LABEL = {of:"Oficial",pr:"Prensa",pv:"Por verificar"};
const edgeEst = e => e[2] || ((EN[e[0]].estado==="pv"||EN[e[1]].estado==="pv") ? "pv" : "of");
const isSupportEdge = (a,b) => ECOL(a)===ECOL(b) && ["id","dis"].includes(EN[a].t);
function ecoSel(){ if(!EN[S.ecoSel]) S.ecoSel = ecoModOf(S.model) || "MOD-01"; return S.ecoSel; }
/* Qué se ilumina: para un modelo, todo lo que llega a él; para otro nodo, a qué modelos llega y quién lo alimenta. */
function ecoSet(x){
  const s=new Set([x]), q=[x];
  if(EN[x].t==="mod"){
    while(q.length){ const c=q.shift(); EIN[c].forEach(f=>{ if(!isSupportEdge(f,c) && !s.has(f)){ s.add(f); q.push(f); } }); }
  } else {
    while(q.length){ const c=q.shift(); EOUT[c].forEach(t=>{ if(!s.has(t)){ s.add(t); q.push(t); } }); }
    EIN[x].forEach(f=>s.add(f));
  }
  return s;
}
/* Camino más corto desde un nodo hasta cada modelo al que llega. */
function ecoPaths(x){
  const par={[x]:null}, q=[x], out=[];
  while(q.length){ const c=q.shift(); EOUT[c].forEach(t=>{ if(!(t in par)){ par[t]=c; q.push(t); } }); }
  Object.keys(par).filter(k=>k!==x && EN[k].t==="mod").forEach(m=>{ const p=[]; for(let k=m;k;k=par[k]) p.unshift(k); out.push(p); });
  return out.sort((a,b)=> (EN[a.at(-1)].app?0:1)-(EN[b.at(-1)].app?0:1) || ECO.nodos.indexOf(EN[a.at(-1)])-ECO.nodos.indexOf(EN[b.at(-1)]));
}
const ecoSt = n => n.estado==="pv" ? `<span class="eco-st pv">Por verificar</span>`
  : n.duda ? `<span class="eco-st duda">● Dato por confirmar</span>` : n.estado==="pr" ? `<span class="eco-st">Prensa</span>` : "";
const ecoPill = n => `<span class="pill ${n.estado}">${ST_LABEL[n.estado]}</span>`;
const ecoBtn = (id,extra="") => { const n=EN[id]; return `<button class="eco-link ${n.estado==="pv"?"pv":""}" data-eco="${id}">${n.c}${extra}</button>`; };

function ecoNodeCard(n,sel,set){
  const cls = ["eco-node", n.t==="mod"?"mod":"", n.t==="mod"&&!n.app?"out":"", n.estado==="pv"?"pv":"",
    n.id===sel?"sel":"", S.ecoAll && !set.has(n.id)?"dim":""].join(" ");
  const sub = n.t==="mod" ? (n.app ? "En la app" : n.chile) : (n.lugar||"");
  return `<button class="${cls}" data-eco="${n.id}" data-node="${n.id}"><b>${n.c}</b><small>${sub}</small>${ecoSt(n)}</button>`;
}

function ecoMap(sel,set){
  const show = n => inChain(n) && (S.ecoAll || set.has(n.id));
  const cols = ECO.columnas.map(c=>c.grupos.map(g=>({g, nodes:ECO.nodos.filter(n=>g.tipos.includes(n.t) && show(n))})).filter(x=>x.nodes.length))
    .filter(gs=>gs.length);
  return `<div class="eco-wrap"><div class="eco-map" id="eco-map" style="--n:${cols.length}">
    <svg class="eco-lines" id="eco-lines" aria-hidden="true"></svg>
    ${cols.map(gs=>`<div class="eco-col"><div class="eco-stack">${gs.map(x=>`<h4>${x.g.titulo}</h4>${x.nodes.map(n=>ecoNodeCard(n,sel,set)).join("")}`).join("")}</div></div>`).join("")}
  </div></div>`;
}

function ecoDetail(sel){
  const n=EN[sel], ty=ECO.tipos[n.t];
  const duda = n.duda ? `<div class="eco-duda internal"><b>Por confirmar:</b> ${n.duda}</div>` : "";
  if(n.t==="mod"){
    const set=ecoSet(sel); set.delete(sel);
    const groups = EGRUPOS.map(g=>[g.titulo, [...set].filter(id=>g.tipos.includes(EN[id].t))]).filter(g=>g[1].length);
    return `<div class="panel eco-detail" id="eco-detail">
      <div class="eco-bar" style="margin:0"><span class="pill">${ty}</span>${n.estado!=="of"?ecoPill(n):""}</div>
      <h2>${n.n}</h2>
      <p style="margin:0 0 6px">${n.clave}</p>
      <p class="hint" style="margin:0 0 16px">Chile: ${n.chile}<span class="internal"> La planta exacta de cada unidad sale de la ficha Inchcape o del VIN.</span></p>
      <div class="grid2">${[groups.slice(0,Math.ceil(groups.length/2)),groups.slice(Math.ceil(groups.length/2))].map(gs=>`<div>${gs.map(([t,ids])=>`
        <div class="eco-group"><h4>${t}</h4><div class="eco-links">${ids.map(id=>ecoBtn(id, EN[id].estado==="pv"?" <small>· por verificar</small>":"")).join("")}</div></div>`).join("")}</div>`).join("")}</div>
      ${n.app?`<a class="eco-link-ficha" href="#${n.app}">Abrir ficha ${MODELS[n.app].nombre} →</a>`:`<p class="hint" style="margin:8px 0 0">Este modelo no está en la app.</p>`}
    </div>`;
  }
  const paths = ecoPaths(sel);
  const children = []; (function walk(list){ list.forEach(o=>{ if(o.id===sel && o.hijos) o.hijos.forEach(h=>children.push(h)); o.hijos&&walk(o.hijos); }); })(ECO.propiedad);
  return `<div class="panel eco-detail" id="eco-detail">
    <div class="eco-bar" style="margin:0"><span class="pill">${ty}</span>${ecoPill(n)}</div>
    <h2>${n.n}</h2>
    <div class="grid2">
      <div>
        <ul class="list">
          ${n.lugar?`<li><span>${n.t==="plat"?"Desarrollo":"Dónde"}</span><b>${n.lugar}</b></li>`:""}
          ${n.dueno?`<li><span>Dueño</span><b>${n.dueno}</b></li>`:""}
        </ul>
        <p style="margin:10px 0 0">${n.que}</p>
        ${children.length?`<div class="eco-group" style="margin-top:14px"><h4>Es dueño de</h4><div class="eco-links">${children.map(h=>ecoBtn(h.id,` <small>· ${h.pct}</small>`)).join("")}</div></div>`:""}
        ${duda}
      </div>
      <div>
        <h3>Cómo llega a los modelos</h3>
        ${paths.length ? paths.map(p=>{ const m=EN[p.at(-1)]; return `<div class="eco-path">${p.map((id,i)=>`${i?`<span class="arrow">→</span>`:""}${i===p.length-1
            ? (m.app?`<a href="#${m.app}">${m.c}</a>`:`<b>${m.c}</b> <small class="hint">(no está en la app)</small>`)
            : `<span>${EN[id].c}</span>`}`).join("")}</div>`; }).join("")
          : `<p class="hint" style="margin:0">No llega a ningún modelo de la gama: está en el mapa como contexto.</p>`}
      </div>
    </div>
  </div>`;
}

}

/* Líneas del mapa: se recalculan al dibujar, al girar la tablet y al cambiar el tamaño. */
function drawEcoLines(){
  const map=document.getElementById("eco-map"), svg=document.getElementById("eco-lines");
  if(!map||!svg) return;
  const sel=ecoSel(), set=ecoSet(sel), box=map.getBoundingClientRect();
  const stacked = matchMedia("(max-width:640px)").matches;
  const R = {}; map.querySelectorAll("[data-node]").forEach(el=>{ const r=el.getBoundingClientRect();
    R[el.dataset.node]={l:r.left-box.left,r:r.right-box.left,t:r.top-box.top,b:r.bottom-box.top,cx:(r.left+r.right)/2-box.left,cy:(r.top+r.bottom)/2-box.top}; });
  const paths=[];
  ECO.enlaces.forEach(e=>{
    const [a,b]=e; if(!R[a]||!R[b]||!set.has(a)||!set.has(b)) return;
    if(EN[sel].t==="mod" && isSupportEdge(a,b)) return;
    const A=R[a], B=R[b]; let d;
    if(stacked){
      const up = A.cy>B.cy, y1= up?A.t:A.b, y2= up?B.b:B.t, k=Math.max(18,Math.abs(y2-y1)/2)*(up?-1:1);
      d=`M${A.cx},${y1} C${A.cx},${y1+k} ${B.cx},${y2-k} ${B.cx},${y2}`;
    } else if(ECOL(a)===ECOL(b)){
      const x=Math.min(A.l,B.l), k=16;
      d=`M${A.l},${A.cy} C${x-k},${A.cy} ${x-k},${B.cy} ${B.l},${B.cy}`;
    } else {
      const right = A.cx<B.cx, x1= right?A.r:A.l, x2= right?B.l:B.r, k=Math.max(14,Math.abs(x2-x1)/2)*(right?1:-1);
      d=`M${x1},${A.cy} C${x1+k},${A.cy} ${x2-k},${B.cy} ${x2},${B.cy}`;
    }
    const cls=[edgeEst(e)==="pv"?"d":"", (a===sel||b===sel)?"hot":""].join(" ");
    paths.push(`<path class="${cls}" d="${d}"/>`);
  });
  svg.setAttribute("viewBox",`0 0 ${box.width} ${box.height}`);
  svg.innerHTML=paths.join("");
}
let ecoRaf=0;
const ecoRedraw=()=>{ cancelAnimationFrame(ecoRaf); ecoRaf=requestAnimationFrame(drawEcoLines); };
window.addEventListener("resize",ecoRedraw);
window.addEventListener("orientationchange",()=>setTimeout(ecoRedraw,250));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(ecoRedraw);

function render(){
  const r=route(), main=document.getElementById("view");
  if(MODELS[r] && r!==S.model){ setModel(r); save(); }
  if(EV_VIEWS.includes(r) && !isEV(M)){ setModel(S.lastEv && MODELS[S.lastEv] ? S.lastEv : "ex30"); save(); }
  if(r==="phev" && !isPH(M)){ setModel(S.lastPh && MODELS[S.lastPh] ? S.lastPh : "xc60"); save(); }
  document.getElementById("navlinks").innerHTML=navHTML(r);
  document.getElementById("mobilenav").innerHTML=navHTML(r);

  document.querySelectorAll("[data-client-toggle]").forEach(t=>t.setAttribute("aria-checked",S.client));
  document.body.classList.toggle("client",S.client);
  AFTER[r] && AFTER[r]();
}
function refreshResult(){ const f=AFTER[route()]; f&&f(); }

document.addEventListener("click",e=>{
  const eg=e.target.closest("[data-eco-go]");
  if(eg){ S.ecoSel=eg.dataset.ecoGo; S.ecoTab="mapa"; save(); return; }
  const eb=e.target.closest("[data-eco]");
  if(eb){ S.ecoSel=eb.dataset.eco; save(); const y=window.scrollY; render(); window.scrollTo(0,y);
    if(eb.closest(".eco-map")){ const d=document.getElementById("eco-detail"); if(d && d.getBoundingClientRect().top<0) d.scrollIntoView({behavior:"smooth",block:"start"}); }
    return; }
  const mb=e.target.closest("[data-model]");
  if(mb){ setModel(mb.dataset.model); save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  const vb=e.target.closest("[data-ver]");
  if(vb){ S.version=vb.dataset.ver; save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  const sb=e.target.closest("[data-set]");
  if(sb){ const k=sb.dataset.set, raw=sb.dataset.val; S[k]= raw==="true"?true: raw==="false"?false: isNaN(+raw)?raw:+raw;
    save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  const ct=e.target.closest("[data-client-toggle]");
  if(ct){ S.client=!S.client; save(); document.body.classList.toggle("client",S.client);
    document.querySelectorAll("[data-client-toggle]").forEach(t=>t.setAttribute("aria-checked",S.client)); }
});
document.addEventListener("keydown",e=>{

});
document.addEventListener("input",e=>{

  if(t.dataset.money){ const n=+t.value.replace(/\D/g,""); S[t.dataset.money]=n; save(); refreshResult(); }
});
document.addEventListener("change",e=>{ const t=e.target; if(t.dataset.money){ t.value=fmt(S[t.dataset.money]); } });
