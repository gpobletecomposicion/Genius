<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genius</title>
<meta name="theme-color" content="#EEF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Genius">
<meta name="application-name" content="Genius">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Albert Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/albert-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Albert Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/albert-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Albert Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/albert-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Albert Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/albert-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Albert Sans";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/albert-sans-latin-800-normal.woff2) format("woff2")}
:root{
  --paper:#EEF1F0; --surface:#FFFFFF; --ink:#16232C; --muted:#5A6A73; --line:#D2D9DC;
  --accent:#2F5F7E; --accent-soft:#DCE7EE; --moss:#A8922A; --moss-soft:#F1EBCF;
  --warn:#9A3B1F; --warn-soft:#F6E2DA; --ok:#2E6B4A; --ok-soft:#DDEDE3;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10181D; --surface:#18232A; --ink:#E6ECEE; --muted:#97A6AE; --line:#2B3A43;
    --accent:#86B4D2; --accent-soft:#1F3341; --moss:#D8C25E; --moss-soft:#33301C;
    --warn:#E79A7E; --warn-soft:#3A2219; --ok:#8CC9A5; --ok-soft:#1C3328;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10181D; --surface:#18232A; --ink:#E6ECEE; --muted:#97A6AE; --line:#2B3A43;
  --accent:#86B4D2; --accent-soft:#1F3341; --moss:#D8C25E; --moss-soft:#33301C;
  --warn:#E79A7E; --warn-soft:#3A2219; --ok:#8CC9A5; --ok-soft:#1C3328;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Albert Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));
  padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.01em;margin:0 10px 2px}
.brand-sub{color:var(--muted);font-size:.85rem;margin:0 10px 22px}
nav.rail a{display:block;padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
nav.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav.rail .spacer{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);cursor:pointer;font-weight:600;font-size:.95rem}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.toggle[aria-checked="true"] .switch{background:var(--accent)}
.toggle[aria-checked="true"] .switch::after{transform:translateX(18px)}
.stamp{color:var(--muted);font-size:.78rem;margin:10px 10px 0}

main{padding:32px clamp(18px,4vw,48px) 80px;max-width:1180px;width:100%}
h1{font-size:clamp(2rem,4vw,2.9rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
h2{font-size:1.3rem;margin:34px 0 12px;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:0 0 8px}
.lede{color:var(--muted);max-width:62ch;margin:0 0 24px}
p{max-width:70ch}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:10px 16px;border-radius:9px;cursor:pointer;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.grid-calc{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}

/* hero del modelo */
.model-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.price{font-size:1.6rem;font-weight:800}
.price small{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink)}
.spec{padding:16px 14px 18px 0;border-bottom:1px solid var(--line)}
.spec .v{font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:800;letter-spacing:-.02em;line-height:1}
.spec .v span{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.spec .k{color:var(--muted);font-size:.9rem;margin-top:6px}

.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}
.list li:last-child{border-bottom:0}
.list li b{font-weight:600;text-align:right}

.note{border-left:4px solid var(--moss);background:var(--moss-soft);padding:14px 16px;border-radius:0 12px 12px 0;margin:12px 0}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note p{margin:4px 0}
.internal-tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--moss);margin-bottom:4px}
body.client .internal{display:none!important}

/* tabla comparativa */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{position:sticky;top:0;background:var(--surface);font-size:1rem}
tbody th{font-weight:500;color:var(--muted);width:30%}
tr.diff td{background:var(--accent-soft)}
tr.group th{color:var(--ink);font-weight:800;padding-top:22px;background:transparent}

/* campos */
.field{margin-bottom:18px}
.field label,.field .lab{display:flex;justify-content:space-between;gap:12px;font-weight:600;margin-bottom:8px}
.field label output{color:var(--accent);font-weight:800}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 12px}
.money span{color:var(--muted)}
.money input{border:0;background:transparent;padding:12px 6px;width:100%;min-width:0}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* resultados */
.result{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.big{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.big-label{color:var(--muted);margin-top:6px}
.bars{margin:22px 0 6px;display:grid;gap:12px}
.bar .row{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:4px}
.bar .track{height:14px;background:var(--paper);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--accent);transition:width .35s ease}
.bar.alt .fill{background:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin-top:16px;font-size:.95rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700;text-align:right}
.est{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-bottom:12px}

/* gama */
.range-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.car{display:block;text-decoration:none;color:inherit;padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:150px;position:relative}
.car .name{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.car .what{color:var(--muted);font-size:.92rem}
.car .from{margin-top:18px;font-weight:700}
.car.soon{background:transparent;border-style:dashed;cursor:default}
.car.soon .name{color:var(--muted)}
.car.live{border:2px solid var(--ink)}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--muted);margin-top:14px}

svg.chart text{fill:var(--muted);font-size:12px;font-family:inherit}
.legend{display:flex;gap:18px;font-size:.88rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.mobile-nav{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.rail{display:none}
  main{padding-top:20px;padding-bottom:110px}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .mobile-nav a{flex:none;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem}
  .mobile-nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .mobile-top{display:flex!important}
  .grid2,.grid-calc{grid-template-columns:1fr}
  .result{position:static}
  .specs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.mobile-top{display:none;justify-content:space-between;align-items:center;margin-bottom:16px}
.mobile-top .toggle{padding:8px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* sensación de app */
html,body{overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
nav,button,.seg,.toggle,.car,.mobile-nav{-webkit-user-select:none;user-select:none}
button:active,.car:active,.seg button:active{transform:scale(.98)}
.install{display:none;margin-bottom:10px;border:0;border-radius:12px;padding:12px;background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer}
.install.show{display:block}
.offline-chip{display:none;margin:8px 10px 0;font-size:.8rem;font-weight:700;color:var(--moss)}
body.is-offline .offline-chip{display:block}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--paper);transition:opacity .35s ease}
.splash img{width:96px;height:96px;border-radius:22px}
.splash.hide{opacity:0;pointer-events:none}
@media (max-width:900px){ .mobile-nav a{min-height:44px;display:flex;align-items:center} }
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true"><img src="icons/icon-192.png" alt=""></div>
<div class="app">
  <nav class="rail" aria-label="Secciones">
    <div class="brand">Genius</div>
    <div class="brand-sub">Volvo · La Dehesa</div>
    <div id="navlinks"></div>
    <div class="spacer"></div>
    <button class="install" id="installBtn">Instalar app</button>
    <div class="toggle" role="switch" tabindex="0" aria-checked="false" data-client-toggle>
      Modo cliente <span class="switch" aria-hidden="true"></span>
    </div>
    <p class="stamp" id="stamp"></p>
    <p class="offline-chip">Sin conexión: funcionando con los datos guardados</p>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="mobile-nav" id="mobilenav" aria-label="Secciones"></nav>

<script src="modelos.js"></script>
<script>
/* ---------- Datos: vienen de modelos.js ---------- */
const DATA_DATE = GENIUS_DATA.fecha;
const MODELS = GENIUS_DATA.modelos;
let M, V, ORDER, EQUIP;
const RANGE = GENIUS_DATA.gama;
const CAMP = GENIUS_DATA.campana;
const fromPrice = id => Math.min(...Object.values(GENIUS_DATA.modelos[id].versiones).map(v=>v.price));
const COND = {ciudad:{label:"Ciudad",f:0.86},mixto:{label:"Mixto",f:1},autopista:{label:"Autopista",f:1.2}};

/* ---------- Estado (guardado en este navegador) ---------- */
const DEFAULTS = {
  model:"ex30", version:"plus", client:false,
  kmDay:40, daysWeek:6, cond:"mixto", cold:false, homeShare:80,
  tHome:250, tPublic:400, fuel:1550, kmL:12,
  years:5, kmYear:15000, priceIce:32000000, maintEv:200000, maintIce:450000,
  permEv:120000, permIce:380000, insEv:1000000, insIce:1000000, resEv:50, resIce:50,
  from:20, to:80, charger:"wb7",
  limit:100, reserve:true
};
let S;
try{ S = Object.assign({},DEFAULTS, JSON.parse(localStorage.getItem("genius-state")||"{}")); }catch(e){ S = {...DEFAULTS}; }
function save(){ try{ localStorage.setItem("genius-state",JSON.stringify(S)); }catch(e){} }
/* Modelo activo: lo eligen la Gama, la ficha o el selector de las calculadoras. Cada modelo recuerda su versión. */
function setModel(id){
  if(!MODELS[id]) id="ex30";
  if(S.model && V && V[S.version]){ S.verByModel = Object.assign({},S.verByModel,{[S.model]:S.version}); }
  S.model=id; M=MODELS[id]; V=M.versiones; ORDER=M.orden; EQUIP=M.equipamiento;
  const keep=(S.verByModel||{})[id];
  S.version = V[keep] ? keep : (V[S.version] ? S.version : ORDER[0]);
}
setModel(S.model);

const clp = n => "$" + Math.round(n).toLocaleString("es-CL");
const fmt = (n,d=0) => Number(n).toLocaleString("es-CL",{minimumFractionDigits:d,maximumFractionDigits:d});
const ver = () => V[S.version];
const dcText = v => v.dc ? v.dc+" kW" : "Por confirmar";
const consOf = (v) => v.cons * COND[S.cond].f * (S.cold ? 1.2 : 1); // kWh/100 km

/* ---------- Navegación ---------- */
const ROUTES = [
  ["gama","Gama"],["ficha","Ficha"],["comparar","Comparar versiones"],["energia","Costo de energía"],
  ["costo-total","Costo total"],["carga","Tiempo de carga"],["autonomia","Autonomía real"],["campana","Campaña de batería"]
];
function navHTML(cur){ return ROUTES.map(([id,l])=> id==="ficha"
  ? `<a href="#${S.model}" ${MODELS[cur]?'aria-current="page"':''}>${M.nombre}</a>`
  : `<a href="#${id}" ${id===cur?'aria-current="page"':''}>${l}</a>`).join(""); }

function modelSeg(){
  return `<div class="seg" role="group" aria-label="Modelo" style="margin-bottom:8px">${Object.keys(MODELS).map(k=>`<button data-model="${k}" aria-pressed="${S.model===k}">${MODELS[k].nombre}</button>`).join("")}</div>`;
}

function versionSeg(){
  return `<div class="seg" role="group" aria-label="Versión">${ORDER.map(k=>`<button data-ver="${k}" aria-pressed="${S.version===k}">${V[k].name}</button>`).join("")}</div>`;
}
function seg(name,opts,cur){
  return `<div class="seg" role="group">${opts.map(([v,l])=>`<button data-set="${name}" data-val="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join("")}</div>`;
}
function range(key,label,min,max,step,unit,hint){
  return `<div class="field"><label for="f-${key}">${label}<output id="o-${key}">${fmt(S[key])}${unit}</output></label>
  <input type="range" id="f-${key}" data-key="${key}" data-unit="${unit}" min="${min}" max="${max}" step="${step}" value="${S[key]}">${hint?`<div class="hint">${hint}</div>`:""}</div>`;
}
function money(key,label,prefix="$",suffix="",hint=""){
  return `<div class="field"><div class="lab"><span>${label}</span></div><div class="money"><span>${prefix}</span>
  <input inputmode="numeric" data-money="${key}" value="${fmt(S[key])}" aria-label="${label}"><span>${suffix}</span></div>${hint?`<div class="hint">${hint}</div>`:""}</div>`;
}
function bar(label,val,max,text,alt){
  const w = max>0 ? Math.max(2,Math.min(100,val/max*100)) : 0;
  return `<div class="bar ${alt?"alt":""}"><div class="row"><span>${label}</span><b>${text}</b></div><div class="track"><div class="fill" style="width:${w}%"></div></div></div>`;
}

/* ---------- Vistas ---------- */
const views = {};

views.gama = () => `
  <h1>Gama Volvo Chile</h1>
  <p class="lede">Toca un modelo para ver versiones, ficha y argumentos. El resto de la gama se suma desde tus dossiers.</p>
  <div class="range-grid">
    ${RANGE.map(m=> m.modelo && MODELS[m.modelo]
      ? `<a class="car live" href="#${m.modelo}"><div class="name">${m.nombre}</div><div class="what">${m.tipo}</div><div class="from">Desde ${clp(fromPrice(m.modelo))}</div></a>`
      : `<div class="car soon"><div class="name">${m.nombre}</div><div class="what">${m.tipo}</div><span class="chip">Próxima versión</span></div>`).join("")}
  </div>
  <h2>Calculadoras</h2>
  <div class="range-grid">
    <a class="car" href="#energia"><div class="name" style="font-size:1.25rem">Costo de energía</div><div class="what">Cuánto cuesta el km frente a la bencina, al mes y al año.</div></a>
    <a class="car" href="#costo-total"><div class="name" style="font-size:1.25rem">Costo total</div><div class="what">Compra, energía, mantención, permiso y seguro a varios años.</div></a>
    <a class="car" href="#carga"><div class="name" style="font-size:1.25rem">Tiempo de carga</div><div class="what">Del % actual al % objetivo, en casa o en electrolinera.</div></a>
    <a class="car" href="#autonomia"><div class="name" style="font-size:1.25rem">Autonomía real</div><div class="what">Kilómetros entre cargas según uso, clima y límite de carga.</div></a>
  </div>`;

const fichaView = () => {
  const v = ver();
  const eq = `<ul class="list">${EQUIP.map(r=>`<li><span>${r.item}</span><b>${r[v.id]}</b></li>`).join("")}</ul>`;
  return `
  <div class="model-head">
    <div><h1>${M.nombre} ${v.name}</h1><p class="lede" style="margin:0">${v.drive} · batería ${v.gross} kWh ${v.chem}</p></div>
    <div class="price">${clp(v.price)}<small>Precio con financiamiento y bonos, incluye IVA</small></div>
  </div>
  ${versionSeg()}
  <div class="specs" style="margin-top:22px">
    <div class="spec"><div class="v">${v.wltp}<span>km</span></div><div class="k">Autonomía WLTP</div></div>
    <div class="spec"><div class="v">${fmt(v.acc,1)}<span>s</span></div><div class="k">0 a 100 km/h</div></div>
    <div class="spec"><div class="v">${v.hp}<span>hp</span></div><div class="k">${v.kw} kW · ${v.nm} Nm</div></div>
    <div class="spec"><div class="v">~${v.dc1080}<span>min</span></div><div class="k">Carga rápida 10–80%</div></div>
  </div>
  <div class="grid2" style="margin-top:22px">
    <div class="panel">
      <h3>Ficha</h3>
      <ul class="list">
        <li><span>Batería bruta / neta</span><b>${v.gross} / ~${v.net} kWh</b></li>
        <li><span>Química</span><b>${v.chem}</b></li>
        <li><span>Motores</span><b>${v.motors}</b></li>
        <li><span>Tracción</span><b>${v.traction}</b></li>
        <li><span>Autonomía realista (mixto)</span><b>${v.real} km</b></li>
        <li><span>Carga DC máxima</span><b>${dcText(v)}</b></li>
        ${v.dc50?`<li><span>Carga 10–80% con 50 kW</span><b>~${v.dc50} min</b></li>`:""}
        <li><span>Bomba de calor</span><b>${M.bombaCalor}</b></li>
        <li><span>Carga AC máxima</span><b>${v.ac} kW</b></li>
        <li><span>Carga diaria recomendada</span><b>${v.daily}</b></li>
        <li><span>Llantas</span><b>${v.wheels}</b></li>

function energyCalc(){
  const v = ver();
  const cons = consOf(v);
  const kmMonth = S.kmDay * S.daysWeek * 4.33;
  const kwhMonth = kmMonth * cons / 100;
  const tMix = (S.homeShare/100)*S.tHome + (1-S.homeShare/100)*S.tPublic;
  const evMonth = kwhMonth * tMix;
  const iceMonth = kmMonth / S.kmL * S.fuel;
  return {cons,kmMonth,kwhMonth,tMix,evMonth,iceMonth,evKm:evMonth/kmMonth||0,iceKm:iceMonth/kmMonth||0};
}

function tcoCalc(){
  const e = energyCalc(), v = ver();
  const evKm = e.evKm, iceKm = e.iceKm;
  const yrs = S.years, km = S.kmYear;
  const ev = {buy:v.price*(1-S.resEv/100), energy:evKm*km*yrs, maint:S.maintEv*yrs, perm:S.permEv*yrs, ins:S.insEv*yrs};
  const ice = {buy:S.priceIce*(1-S.resIce/100), energy:iceKm*km*yrs, maint:S.maintIce*yrs, perm:S.permIce*yrs, ins:S.insIce*yrs};
  const sum = o => Object.values(o).reduce((a,b)=>a+b,0);
  const cumEv=[], cumIce=[];
  for(let y=0;y<=yrs;y++){
    cumEv.push(v.price + y*(evKm*km + S.maintEv + S.permEv + S.insEv));
    cumIce.push(S.priceIce + y*(iceKm*km + S.maintIce + S.permIce + S.insIce));
  }
  let cross=null; for(let y=1;y<=yrs;y++){ if(cumEv[y]<=cumIce[y] && cumEv[y-1]>cumIce[y-1]){ const a=cumEv[y-1]-cumIce[y-1], b=cumEv[y]-cumIce[y]; cross=y-1+a/(a-b); break; } }
  if(cumEv[0]<=cumIce[0]) cross=0;
  return {ev,ice,tEv:sum(ev),tIce:sum(ice),cumEv,cumIce,cross};
}

function chart(r){
  const W=460,H=190,p={l:8,r:8,t:12,b:24}, n=r.cumEv.length-1;
  const all=[...r.cumEv,...r.cumIce], mn=Math.min(...all)*0.95, mx=Math.max(...all)*1.02;
  const x=i=>p.l+(W-p.l-p.r)*i/n, y=v=>p.t+(H-p.t-p.b)*(1-(v-mn)/(mx-mn));
  const path=a=>a.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const ticks=r.cumEv.map((_,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${i}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gasto acumulado por año">
    <path d="${path(r.cumIce)}" fill="none" stroke="var(--muted)" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="${path(r.cumEv)}" fill="none" stroke="var(--accent)" stroke-width="3.5"/>${ticks}</svg>

}

const CHARGERS = {
  e10:{label:"Enchufe 10 A",kw:2.2,ac:true}, e16:{label:"Enchufe 16 A",kw:3.6,ac:true},
  wb7:{label:"Wallbox 7,2 kW",kw:7.2,ac:true}, wb11:{label:"Wallbox trifásico 11 kW",kw:11,ac:true},
  dc:{label:"Carga rápida DC",kw:null,ac:false}
};
function chargeCalc(){
  const v=ver(), c=CHARGERS[S.charger], a=Math.min(S.from,S.to), b=Math.max(S.from,S.to);
  let min;
  if(c.ac){ min = v.gross*(b-a)/100 / (c.kw*0.8) * 60; }
  else{
    const rate = v.dc1080/70; // min por punto %
    const seg=(lo,hi,f)=>Math.max(0,Math.min(b,hi)-Math.max(a,lo))*rate*f;
    min = seg(0,10,1.1)+seg(10,80,1)+seg(80,100,3);
  }
  const kwh=v.net*(b-a)/100, km=kwh/(v.cons/100);
  const cost=kwh*(c.ac?S.tHome:S.tPublic);
  return {min,kwh,km,cost,c};
}
const hm = m => { m=Math.round(m); const h=Math.floor(m/60), r=m%60; return h? `${h} h ${String(r).padStart(2,"0")} min` : `${r} min`; };
